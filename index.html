<style>
:root{--ink:#0c0b0d;--panel:#141216;--paper:#fbf7f2;--muted:#b9b0a8;--red:#e8141c;--gold:#ffc21a;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;color:var(--paper);font:500 17px/1.4 "Barlow Condensed","Arial Narrow",sans-serif;
  background:repeating-conic-gradient(from 0deg at 50% 50%,#1d0507 0deg 6deg,var(--ink) 6deg 12deg);
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:min(400px,100%);background:var(--panel);border:3px solid var(--paper);box-shadow:8px 8px 0 var(--red);padding:22px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font:400 64px/.85 "Bebas Neue",Impact,sans-serif;letter-spacing:.02em;text-shadow:4px 4px 0 var(--red)}
.sub{margin:0 0 6px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--red)}
label{font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--muted)}
input[type=text],input[type=password]{width:100%;padding:10px 12px;font:16px ui-monospace,Menlo,Consolas,monospace;background:var(--ink);color:var(--paper);border:2px solid var(--paper)}
input:focus{outline:3px solid var(--gold);outline-offset:0}
.row{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
button{margin-top:6px;font:400 26px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.06em;padding:10px 0 8px;background:var(--red);color:var(--paper);border:3px solid var(--paper);cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.4em;margin:0;color:var(--gold);font-weight:700}
</style>

const KEEP = "abhi-force-key";
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deriveKey(user, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(user + "\n" + pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(VAULT.salt), iterations: VAULT.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function unlock(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(VAULT.iv) }, key, b64(VAULT.data));
  const html = new TextDecoder().decode(plain);
  // Replace the login page only once it has fully loaded; writing earlier
  // appends to the login page instead of replacing it.
  if (document.readyState !== "complete") await new Promise((r) => addEventListener("load", r, { once: true }));
  document.open(); document.write(html); document.close();
}
(async () => {
  if (!window.crypto || !crypto.subtle) { document.getElementById("f").hidden = false; document.getElementById("msg").textContent = "This browser can't unlock the console. Use a current Chrome, Edge, Firefox or Safari over https."; return; }
  let saved = null; try { saved = localStorage.getItem(KEEP); } catch (e) {}
  const form = document.getElementById("f");
  if (saved) {
    try {
      const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
      await unlock(key); return;
    } catch (e) { try { localStorage.removeItem(KEEP); } catch (_) {} }
  }
  form.hidden = false;
  document.getElementById("u").focus();
})();
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const b = document.getElementById("b"), m = document.getElementById("msg");
  b.disabled = true; m.textContent = "Checking…";
  try {
    const key = await deriveKey(document.getElementById("u").value.trim(), document.getElementById("p").value);
    if (document.getElementById("r").checked) {
      try { const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key)); localStorage.setItem(KEEP, btoa(String.fromCharCode(...raw))); } catch (e) {}
    }
    await unlock(key);
  } catch (e) {
    m.textContent = "Wrong username or password.";
    b.disabled = false;
    document.getElementById("p").select();
  }
});
